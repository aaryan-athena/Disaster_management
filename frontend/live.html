<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Live Feed — DM Suite</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span>DM</span>
      <div class="brand-copy"><div>Disaster Management Suite</div><small>Vision-powered response coordination</small></div>
    </div>
    <nav id="main-nav"></nav>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Live Recognition</h2>

    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;">
      <span class="hint">Source: <strong>Raspberry Pi (push mode)</strong></span>
      <span id="pi-badge" style="
        display:inline-block;padding:.2rem .7rem;border-radius:999px;font-size:.8rem;font-weight:600;
        background:#fef3c7;color:#92400e;">Waiting for Pi…</span>
    </div>

    <div>
      <img id="stream" alt="Live video stream"
           style="max-width:100%;border:1px solid #ddd;border-radius:12px;background:#0f172a;"/>
      <p id="stream-status" class="hint" style="margin-top:.4rem;"></p>
    </div>

    <p id="live-location-status" class="hint">Requesting browser location…</p>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <p>&copy; 2025 Disaster Management and Rehabilitation</p>
    <small>Powered by MediaPipe · FaceNet · Cloudinary</small>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/live.js"></script>
</body>
</html>
