<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recognize — DM Suite</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span>DM</span>
      <div class="brand-copy"><div>Disaster Management Suite</div><small>Vision-powered response coordination</small></div>
    </div>
    <nav id="main-nav"></nav>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Recognize Person</h2>
    <p class="hint" id="threshold-label">Similarity threshold: loading…</p>

    <div class="grid">
      <div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="actions" style="margin-top:12px;">
          <button class="btn" id="start-camera">Start Camera</button>
          <button class="btn primary" id="capture">Capture &amp; Identify</button>
        </div>
        <p id="geo-status" class="hint">Requesting location…</p>
      </div>
      <div id="result" class="result">
        <p class="hint" style="text-align:center;padding-top:40px;">Result will appear here</p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <p>&copy; 2025 Disaster Management and Rehabilitation</p>
    <small>Powered by MediaPipe · FaceNet · Cloudinary</small>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/recognize.js"></script>
</body>
</html>
