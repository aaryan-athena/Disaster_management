<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register — DM Suite</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span>DM</span>
      <div class="brand-copy"><div>Disaster Management Suite</div><small>Vision-powered response coordination</small></div>
    </div>
    <nav id="main-nav"></nav>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Register a Person</h2>
    <div id="alert"></div>

    <form id="register-form" enctype="multipart/form-data">
      <div class="grid">
        <div style="display:flex;flex-direction:column;gap:16px;">
          <label>Name *
            <input type="text" name="name" required placeholder="Full name"/>
          </label>
          <label>Location
            <input type="text" name="location" placeholder="City or area (optional)"/>
          </label>
          <label>Gender
            <select name="gender">
              <option value="">— select —</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </label>
          <label>Upload image
            <input type="file" name="image" id="file-input" accept="image/*"/>
          </label>
          <p class="hint">Or use your camera below to capture a photo.</p>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <video id="video" autoplay playsinline style="width:100%;border-radius:12px;background:#0f172a;"></video>
          <canvas id="canvas" style="display:none;"></canvas>
          <input type="hidden" name="image_data" id="image_data"/>
          <div class="actions">
            <button type="button" class="btn" id="start-camera">Start Camera</button>
            <button type="button" class="btn" id="capture">Capture Photo</button>
          </div>
          <p id="capture-status" class="hint"></p>
        </div>
      </div>

      <div class="actions" style="margin-top:24px;">
        <button type="submit" class="btn primary" id="submit-btn">Register Person</button>
      </div>
    </form>
  </section>
</main>

<footer>
  <div class="footer-inner">
    <p>&copy; 2025 Disaster Management and Rehabilitation</p>
    <small>Powered by MediaPipe · FaceNet · Cloudinary</small>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
