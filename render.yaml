services:
  - type: web
    name: people-recognition
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 300 --worker-class sync --log-level info app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PI_AUTH_TOKEN
        sync: false   # Set this secret in the Render dashboard
